[project]
name = "cefore-emu"
version = "0.2.0"
description = "Network emulator for Cefore (Content-Centric Networking) deployments"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "flask>=3.1.3",
    "matplotlib>=3.10.8",
    "mininet>=2.3.0.dev6",
    "networkx>=3.6.1",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
]

[project.scripts]
ceforeemu = "src.cli.main:main"
ceforeemu-log = "src.log.cli:main"
ceforeemu-connect = "src.runtime.external_net:main"

[dependency-groups]
dev = [
    "mypy>=1.0",
    "ruff>=0.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "types-pyyaml>=6.0.12.20260724",
    "types-networkx>=3.6.1.20260728",
]

[tool.coverage.run]
# artifact (.coverage/cov.json) を runner 外で解析するため絶対 path を残さない
relative_files = true

[tool.coverage.report]
# 85 は outage floor (大規模なカバレッジ後退の検知) — 回帰追跡器ではない。
# タイト床 89 は運用ノイズとして不採用 (ADR-0004)。実測ベースライン 89.9%。
fail_under = 85
# 既定 precision=0 は 84.6% を「85」に丸めて pass させる
precision = 2

[tool.coverage.json]
# ローカルで --cov-report=json を明示指定した時に context 付きで出すための設定。
# CI の artifact は .coverage (SQLite) のみ — context はそこに内蔵されており、
# show_contexts 付き JSON は同一データで 142MB に膨らむ実測があるため。
show_contexts = true

[tool.mypy]
# CI typecheck gate はこの default 設定での `mypy src` = 0 errors を守る。
# --strict mode は不採用（別次元の負債になる）。baseline/ratchet 機構も持たない —
# 抑制は個別の `# type: ignore[code]` + 理由コメントのみ、腐敗は下の
# warn_unused_ignores が検知する。
python_version = "3.12"
warn_unused_ignores = true

[[tool.mypy.overrides]]
# mininet wheel (2.3.0.dev6) は型情報を持たず stubs も存在しない
module = "mininet.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: requires root/Mininet/Cefore (deselect with '-m not integration')",
    "synthetic: env-gated external-bridge synthetic product test (root + CEFEMU_SYNTHETIC_ROOT=1)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.webui" = ["assets/*.html", "assets/vendor/*.js", "assets/vendor/*.css"]
