[project]
name = "cefore-emu"
version = "0.2.0"
description = "Network emulator for Cefore (Content-Centric Networking) deployments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "matplotlib>=3.10.8",
    "mininet>=2.3.0.dev6",
    "networkx>=3.6.1",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
]

[project.scripts]
ceforeemu = "src.cli.main:main"
ceforeemu-log = "src.log.cli:main"
ceforeemu-connect = "src.runtime.external_net:main"

[dependency-groups]
dev = [
    "mypy>=1.0",
    "ruff>=0.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: requires root/Mininet/Cefore (deselect with '-m not integration')",
    "synthetic: env-gated external-bridge synthetic product test (root + CEFEMU_SYNTHETIC_ROOT=1)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.webui" = ["assets/*.html", "assets/vendor/*.js", "assets/vendor/*.css"]
