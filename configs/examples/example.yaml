# =============================================================================
# CeforeEmu 設定ファイル (全パラメータ記載)
# Usage: sudo .venv/bin/python3 -m src disaster --config configs/examples/example.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# トポロジ基本設定
# -----------------------------------------------------------------------------
hosts: 5               # ホスト数 (>=3)
switches: 8            # スイッチ数 (>=2, 最大 n*(n-1)/2)
seed: 42               # 乱数シード (null でランダム)
k: 2                   # 宛先ごとの最短パス数 (マルチパスルーティング)
host_degree_min: 2     # ホストあたり最小スイッチ接続数 (>=1)
host_degree_max: 5     # ホストあたり最大スイッチ接続数 (>= host_degree_min)
switch_use_all: false   # true: --switches個までスイッチを作り余分なリンクを均等配分
node_per_switch: 0     # スイッチあたり最大ホスト数 (0=無制限, 2=リンクごとに1スイッチ)

# -----------------------------------------------------------------------------
# 出力設定
# -----------------------------------------------------------------------------
num: 1                         # 実験番号 (ログディレクトリ出力を有効化, null で無効)
output_dir: "logs"             # ベース出力ディレクトリ
timestamp: false               # true: 出力ディレクトリ名にタイムスタンプ付与
legacy_layout: false           # true: カレントディレクトリに出力 (レガシー互換)
topo_png: "topology.png"       # トポロジPNG出力パス (null で出力しない)
topo_layout: "kamada_kawai"    # レイアウト: spring / kamada_kawai / circular
script_log: "script.log"       # スクリプトログファイル名 (null でデフォルト名)
no_script_log: false           # true: スクリプトログ出力を無効化

# -----------------------------------------------------------------------------
# 災害シミュレーション (ホスト障害)
# -----------------------------------------------------------------------------
down_interval: 30      # ダウンイベント間隔 (秒, 0で無効)
down_duration: 10      # ホストダウン維持時間 (秒)
down_count: 1          # サイクルあたりダウンホスト数
down_stagger: 2        # サイクル内の個別ダウン間隔 (秒)
down_exclude: "0,4"    # ダウン対象から除外するホストID (カンマ区切り)

# -----------------------------------------------------------------------------
# キャッシュ設定
# -----------------------------------------------------------------------------
cache_count: 2                 # キャッシュノード数 (0 = down_count + 1)
cache_default_rct_ms: 10000    # キャッシュノードの CACHE_DEFAULT_RCT (ミリ秒, >=1000)

# -----------------------------------------------------------------------------
# コンテンツ操作: puts (cefputfile / cefpubfile)
# -----------------------------------------------------------------------------
puts:
  - host: 4                        # パブリッシャーホストID
    uri: "ccnx:/test/sample"       # コンテンツURI
    file: "./sample-putfile"        # パブリッシュするファイルパス
    rate: 10                        # 転送レート (Mbps) [オプション]
    block_size: 1024                # 最大ペイロード長 (bytes) [オプション]
    expiry: 3000                    # Content Objectライフタイム (秒) [オプション]
    cache_time: 3000                # キャッシュ削除期間 (秒) [オプション]
    valid_algo: "crc32c"            # バリデーションアルゴリズム: crc32c / rsa-sha256 [オプション]
    # port_num: 9695                # ポート番号 [オプション]
    # mode: "pubsub"               # Pub/Subモデル時: cefpubfileを使用 [オプション]
    # pub_opts:                     # Pub/Sub用パブリッシャーオプション [オプション]
    #   lifetime: 5000

# -----------------------------------------------------------------------------
# コンテンツ操作: gets (cefgetfile / cefsubfile)
# -----------------------------------------------------------------------------
gets:
  - host: 0                        # コンシューマーホストID
    uri: "ccnx:/test/sample"       # 取得するコンテンツURI
    # file: "./recvfile"            # 受信ファイル保存パス [オプション]
    # owner_only: false             # オーナー限定モード [オプション]
    # chunk: 100                    # 最大チャンク取得数 [オプション]
    # pipeline: 4                   # パイプライン数 [オプション]
    # sg: 1                         # Send Long Life Interest [オプション]
    # valid_algo: "crc32c"          # バリデーションアルゴリズム [オプション]
    # port_num: 9695                # ポート番号 [オプション]
    # mode: "pubsub"               # Pub/Subモデル時: cefsubfileを使用 [オプション]
    # sub_opts:                     # Pub/Sub用サブスクライバーオプション [オプション]
    #   wait: 10
    #   consumer_per_content: 2

# -----------------------------------------------------------------------------
# Auto生成 (puts/getsを自動生成, 手動のputs/getsと併用可能)
# -----------------------------------------------------------------------------
# ■ Simple形式 (uri_prefix): 通常のcefputfile/cefgetfileを生成
# auto:
#   publishers: [4]                 # パブリッシャーホストIDリスト
#   consumers: "random:3"           # コンシューマー: "random:N" またはリスト [0, 1, 2]
#   content_count: 3                # パブリッシャーあたりコンテンツ数
#   uri_prefix: "ccnx:/test"        # URIプレフィックス
#   consumer_per_content: 2          # コンテンツあたりのget操作数
#
# ■ Pub/Sub形式 (uri): cefpubfile/cefsubfileを生成
# auto:
#   publishers: [4]
#   consumers: [0, 1, 2]
#   content_count: 2
#   uri: "ccnx:/test/stream"        # URI (pubsub形式)
#   pub_opts:                        # パブリッシャーオプション
#     lifetime: 5000
#   sub_opts:                        # サブスクライバーオプション
#     wait: 10
#     consumer_per_content: 1
#
# ■ 複数エントリ (リスト形式)
# auto:
#   - publishers: [4]
#     consumers: "random:2"
#     content_count: 2
#     uri_prefix: "ccnx:/test/data"
#     consumer_per_content: 1
#   - publishers: [3]
#     consumers: [0]
#     content_count: 1
#     uri: "ccnx:/test/live"
#     pub_opts: {}
#     sub_opts:
#       wait: 5

# -----------------------------------------------------------------------------
# イベントスケジューラ (時限イベント)
# -----------------------------------------------------------------------------
