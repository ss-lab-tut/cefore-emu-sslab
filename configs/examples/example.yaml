#   - at: 15                       # 開始から15秒後
#     type: link_down              # リンクダウン
#     nodes: [1, 2]                # ノード1-2間
#   - at: 25
#     type: link_up
#     nodes: [1, 2]
#   - at: 30
#     type: fib_del                # FIBエントリ削除
#     host: 3
#     prefix: "ccnx:/test/sample"
#     protocol: udp
#     next_hop: "192.168.1.1"
#   - at: 40
#     type: fib_add
#     host: 3
#     prefix: "ccnx:/test/sample"
#     protocol: udp
#     next_hop: "192.168.1.1"
#   - at: 50
#     type: fib_enable
#     host: 3
#     prefix: "ccnx:/test/sample"
