#       hosts: "all"               # "all", "cache", またはリスト [0, 1, 2]
#     - type: csmgrstatus          # csmgrstatus出力収集
#       hosts: "cache"             # キャッシュノードのみ
#     - type: cefinfo              # cefinfo出力収集
#       hosts: [0]
#       name_prefix: "ccnx:/test"

# -----------------------------------------------------------------------------
# 実行制御
# -----------------------------------------------------------------------------
no_cli: false          # true: インタラクティブCLIをスキップ (自動テスト用)
duration: 0            # 評価フェーズ時間 (秒, 0: シングルサイクル, no_cli時に使用)
results_json: ""       # 結果JSONファイル名 (空文字で無効, 出力ディレクトリ内に配置)
get_interval: 10       # cefgetfile実行間隔 (秒)

# -----------------------------------------------------------------------------
# ウォームアップ設定
# -----------------------------------------------------------------------------
warmup_get_interval: 5             # ウォームアップget操作間隔 (秒, 0で無効)
warmup_only_cache_nodes: true      # true: キャッシュノードのみでウォームアップ
publisher_host: 4                  # パブリッシャーホスト (publisher-downメトリクス用)
hot_uris:                          # ウォームアップ対象URI (リスト形式)
  - "ccnx:/test/sample"
warmup_gets: []                    # 明示的ウォームアップget操作リスト (空でhot_urisから自動生成)
# warmup_gets:                     # 手動指定する場合:
#   - host: 1
#     uri: "ccnx:/test/sample"

