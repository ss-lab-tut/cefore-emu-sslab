# =============================================================================
# M5e per-seed timeline config (seed 1102) -- GENERATED by
# tools/workshop/gen_m5e_config.py; edit the generator, not this file.
#
# Offline-computed csmgrd placement for this seed: [1, 2, 9, 10, 11]
# Roles: protagonist h3 (non-cache; fails in window1),
#        gap-fetcher h1 (cache node; one fetch in gap1
#        writes the fresh URI into its csmgrd -- the network "learns" it),
#        newcomer h4 (non-cache; first touch inside window2),
#        control h5 (non-cache; polls the pre-cached URI).
# Windows (config-time): [20,40], [50,70], [80,100] -- read actual times from
# results.json host_down/host_up records, never assume.
# =============================================================================

hosts: 15
switches: 48
seed: 1102
k: 2
host_degree_min: 2
host_degree_max: 6

num: 1                  # placeholder; overridden per job
output_dir: "logs"
no_cli: true
duration: 150
results_json: "results.json"
publisher_host: 0

cache_config:
  strategy: "k_centers"
  default:
    count: 5
    capacity: 819200
    default_rct_ms: 1800000
    algorithm: "LRU"
    type: "memory"

# Warm the control URI on the cache nodes THEMSELVES (per-seed list above).
# A non-cache host's fetch is never re-served to anyone (2026-07-14 smoke),
# so warming anything else would not create a servable copy. The fresh URI
# deliberately never appears here.
warmup_gets:
  - host: 1
    uri: "ccnx:/m5e/cached"
  - host: 2
    uri: "ccnx:/m5e/cached"
  - host: 9
    uri: "ccnx:/m5e/cached"
  - host: 10
    uri: "ccnx:/m5e/cached"
  - host: 11
    uri: "ccnx:/m5e/cached"

# interval counts from the PREVIOUS cycle's down moment and a still-down
# target is skipped, so interval MUST exceed the previous duration.
failure_scenarios:
  strategy: "manual"
  cycles:
    - interval: 20
      duration: 20
      target: [0]
      allow_publishers: true
    - interval: 30
      duration: 20
      target: [0]
      allow_publishers: true
    - interval: 30
      duration: 20
      target: [0]
      allow_publishers: true

events:
  # Both puts execute in the autotest seed phase regardless of `at`.
  - at: 0
    type: put
    host: 0
    uri: "ccnx:/m5e/cached"
    file: "./sample-putfile"
  - at: 1
    type: put
    host: 0
    uri: "ccnx:/m5e/fresh"
    file: "./sample-putfile"

  # Control line: pre-cached URI polled by an ordinary (non-cache) consumer.
  - at: 5
    type: get
    host: 5
    uri: "ccnx:/m5e/cached"
    repeat:
      interval: 5
      count: 23

  # Protagonist: starts inside window1 -> valley; keeps polling all run.
  - at: 25
    type: get
    host: 3
    uri: "ccnx:/m5e/fresh"
    repeat:
      interval: 4
      count: 24

  # Gap acquisition: a cache node fetches the fresh URI once in gap1
  # ([~43,~50] observed) -> its csmgrd now holds a servable copy.
  - at: 45
    type: get
    host: 1
    uri: "ccnx:/m5e/fresh"
    repeat:
      interval: 3
      count: 2

  # New consumer: first touch lands inside window2 -> proves the copy is
  # served by the NETWORK cache, not by its own earlier fetch.
  - at: 58
    type: get
    host: 4
    uri: "ccnx:/m5e/fresh"
    repeat:
      interval: 4
      count: 16
