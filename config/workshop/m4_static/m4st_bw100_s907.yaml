# =============================================================================
# M4 STATIC: bandwidth-fidelity, 100 Mbps, seed 907 -- static `bw:` variant.
# Usage: sudo .venv/bin/python3 -m src disaster --config config/workshop/m4_static/m4st_bw100_s907.yaml --no-cli
#
# WHY THIS FILE EXISTS (M4 redesign, 2026-07-07): the original m4_bw*.yaml
# family used a `bw_set` *event* fired at t=1 on a single host pair. That
# design was found broken in smoke: by the time bw_set fires, the autotest
# warmup phase (src/scenarios/disaster.py's _run_warmup, which runs BEFORE
# the eval-phase event scheduler) has already prefetched the content to
# every cache-node host over Mininet's unbounded default bandwidth. The
# scheduled eval-phase `get` events (t=20/35/50) then hit those warmed
# caches, so measured throughput (20-87 Mbps in the broken smoke) reflects
# cache locality, not the configured cap.
#
# FIX: this file applies a STATIC `bw:` list covering EVERY host-switch link
# in the topology, from network-creation time -- before daemons start and
# before warmup runs (see src/runtime/scenario_setup.py's _apply_bw_ext,
# called from setup_scenario ahead of build_fleet/_run_warmup). Consequently:
#   - the WARMUP-phase cefgetfile logs (cefgetfile_warmup_h{N}_*.log) are
#     now the network-bound "first fetch" measurement: every link is capped
#     at 100 Mbps before warmup's first byte is requested.
#   - the EVAL-phase cefgetfile logs (cefgetfile_eval_h{N}_*.log, from the
#     t=20/35/50 get events below) are a cache-hit REPEAT fetch of content
#     the warmup phase already pulled onto that host's local cefnetd cache
#     (or a nearby cache node) -- their throughput is expected to exceed the
#     configured cap, and that contrast (warmup vs eval) is exactly what the
#     M4 figure (tools/workshop/plots.py's fig_m4_bw_fidelity) now plots as
#     two series against the same x = configured Mbps.
#
# SEED-SPECIFICITY: unlike a `bw_set` event (which only needs two host
# INDICES that happen to share some switch, resolved at runtime), a static
# `bw:` entry needs a literal switch NAME (e.g. "s2"), and switch names are
# assigned in switch-creation order by src/runtime/topo.py's MeshTopo.build()
# -- fully determined by (hosts, switches, seed, k, host_degree_min/max) but
# otherwise unknowable ahead of time. This file's `bw:` list was generated by
# running:
#   .venv/bin/python3 tools/workshop/topo_fingerprint.py \
#       --config config/workshop/m4_bw10.yaml --seed 907 --json
# and covers EVERY (host, switch) link pair s0:[0, 1], s1:[0, 4], s2:[0, 3], s3:[1, 2], s4:[2, 4], s5:[1, 3], s6:[0, 4] reported by that
# tool for seed 907 at fingerprint 3d7410b397b488ae57ccc8d924b0ca06172e0e7bd28a6d088ff279f97f6360e7. It is only valid for a
# run that actually builds seed 907's topology -- do not reuse this file's
# `bw:` list under a different seed. This is why bw x seed needs its own
# file per pair (5 bw values x 3 seeds = 15 files) rather than one shared
# static list.
#
# seed: 42 below is a placeholder like the sibling m4_bw*.yaml files -- when
# driven through logs/workshop_20260707/manifests/main.json + campaign.py,
# tools/autotest/run.py's _run_one() overwrites cfg["seed"] with the
# manifest's seed (907) directly in the config dict before invoking
# `disaster` (see tools/autotest/run.py), so the placeholder here is never
# actually used for a manifest-driven run. It is set to 42 only to match the
# m4_bw*.yaml sibling files' convention; if this file is ever run standalone
# (not through the manifest), pass `--seed 907` explicitly or the bw list
# below will not match the topology that gets built.
#
# Intended wall-clock duration: 90s. Last scheduled event fires at t=50,
# leaving a 40s tail.
# =============================================================================

hosts: 5
switches: 8
seed: 42                # placeholder; overridden by manifest-driven run.py (see header)
k: 2
host_degree_min: 2      # denser-than-minimum degree raises the odds h0-h1 share a switch
host_degree_max: 4

num: 1                  # placeholder; overridden by run.py
output_dir: "logs"
no_cli: true
duration: 90
results_json: "results.json"
# 2026-07-07 fix: down_* キーは省略すると default が down_interval=30/down_count=5
# で host flapping が有効になる（smoke 実測: [flap] down h1 が発生し get が失敗）。
# 「failure なし」を意図する config は必ず明示的にゼロを指定すること。
down_interval: 0
down_duration: 0
down_count: 0

# No failure_scenarios / down_interval: bandwidth fidelity is measured on a
# healthy network, isolated from disaster-flap noise.

# Static bandwidth cap applied at network-creation time (see file header for
# why this replaces the old bw_set event). One "hN,sM,100" entry per
# host-switch link in seed 907's topology -- every link in the mesh is
# capped, not just one host pair, so no path through the network escapes the
# 100 Mbps ceiling regardless of which host warmup/eval happens to route
# through.
bw:
  - "h0,s0,100"
  - "h1,s0,100"
  - "h0,s1,100"
  - "h4,s1,100"
  - "h0,s2,100"
  - "h3,s2,100"
  - "h1,s3,100"
  - "h2,s3,100"
  - "h2,s4,100"
  - "h4,s4,100"
  - "h1,s5,100"
  - "h3,s5,100"
  - "h0,s6,100"
  - "h4,s6,100"

events:
  - at: 0
    type: put
    host: 0
    uri: "ccnx:/m4/data"
    file: "./sample-putfile"

  - at: 20
    type: get
    host: 1
    uri: "ccnx:/m4/data"
  - at: 35
    type: get
    host: 2
    uri: "ccnx:/m4/data"
  - at: 50
    type: get
    host: 3
    uri: "ccnx:/m4/data"
