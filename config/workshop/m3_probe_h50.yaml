# =============================================================================
# M3 MEMORY CEILING PROBE: 50-host variant (put + 1 get only -- minimal
# footprint, so any run failure or OOM at this host count is attributable to
# scale itself rather than to event/content-op load).
# Usage: sudo .venv/bin/python3 -m src disaster --config config/workshop/m3_probe_h50.yaml --no-cli
# Driven by tools/autotest/run.py (overrides seed/num); values below are placeholders.
#
# This probe set uses a different host-count ladder (20/30/40/50/60) than
# m3_scale_h*.yaml's (5/15/30/45/60) -- it is specifically hunting for the
# host count at which Mininet/cefnetd process overhead starts to exhaust
# memory, so it starts above the scale sweep's lowest points and steps in
# round numbers.
#
# Intended wall-clock duration: 60s. The single get fires at t=10, leaving a
# 50s tail (host/cefnetd startup dominates the wall clock at this scale, not
# the event schedule).
# =============================================================================

hosts: 50
switches: 160             # ~3.2x hosts, same heuristic ratio as m3_scale_h*.yaml
seed: 42                 # placeholder; overridden by run.py
k: 2
host_degree_min: 2
host_degree_max: 6

num: 1                   # placeholder; overridden by run.py
output_dir: "logs"
no_cli: true
duration: 60
results_json: "results.json"
# 2026-07-08 update: ADR-0002 で down_interval/down_duration の default が 0/0 に
# なったため、down_* キーを省略しても host flapping は有効化されない（旧 default
# 30/5 が 2026-07-07 の暗黙 flap 事故の原因だった）。以下の明示ゼロは「failure なし」
# を意図した設定であることを示す自己文書化として残す。
down_interval: 0
down_duration: 0
down_count: 0

events:
  - at: 0
    type: put
    host: 0
    uri: "ccnx:/m3probe/data"
    file: "./sample-putfile"

  - at: 10
    type: get
    host: 1
    uri: "ccnx:/m3probe/data"
