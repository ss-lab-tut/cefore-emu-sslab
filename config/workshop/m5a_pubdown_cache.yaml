# =============================================================================
# M5a HEADLINE CONFIG: deterministic publisher downtime, WITH cache enabled.
# Usage: sudo .venv/bin/python3 -m src disaster --config config/workshop/m5a_pubdown_cache.yaml --no-cli
# Driven by tools/autotest/run.py (overrides seed/num); values below are placeholders.
#
# Intended wall-clock duration: 120s. Last scheduled get repeat fires at t=70,
# leaving a 50s tail.
#
# Story this config tells: host 0 publishes once at t=0. A `failure_scenarios`
# manual cycle takes host 0 itself down at t=30 for 30s (t=30..60). Three
# other hosts keep polling the same URI every 5s from t=10 to t=70, so some
# of those gets land squarely inside the publisher-down window -- giving
# tools/autotest/analyze.py's eval_success_rate_when_publisher_down metric a
# non-zero denominator (with cache enabled, cached copies should keep serving
# gets even while the publisher itself is unreachable).
# =============================================================================

hosts: 15
switches: 48
seed: 42                # placeholder; overridden by run.py
k: 2
host_degree_min: 2
host_degree_max: 6

num: 1                  # placeholder; overridden by run.py
output_dir: "logs"
no_cli: true
duration: 120
results_json: "results.json"
publisher_host: 0        # matches the put host below (documentation/metrics convention)

# -----------------------------------------------------------------------------
# Cache: mirrors config/examples/example.yaml's cache_config shape. 3 cache
# nodes via k_centers (farthest-first selection), so cached copies are spread
# across the mesh rather than clustered near the publisher.
# -----------------------------------------------------------------------------
cache_config:
  strategy: "k_centers"
  default:
    count: 3
    capacity: 819200
    default_rct_ms: 1800000    # 30 min RCT: comfortably outlives the 30s publisher-down window
    algorithm: "LRU"
    type: "memory"

# -----------------------------------------------------------------------------
# Failures: failure_scenarios with strategy "manual" + target: [0] takes the
# PUBLISHER itself down. By default publishers are excluded from all flap
# strategies (see src/runtime/failure_manager.py's exclude_set construction);
# allow_publishers: true is required here to override that and actually down
# host 0 -- that override is the entire point of this config.
# `count` is intentionally omitted: for strategy=manual with an explicit
# `target` list, the manager uses the target list directly and ignores
# `count` (see FlexibleFailureManager._start_cycle_mode's target_list branch).
# -----------------------------------------------------------------------------
failure_scenarios:
  strategy: "manual"
  cycles:
    - interval: 30              # wait 30s after scenario start, then...
      duration: 30               # ...take host 0 down for 30s (up again at t=60)
      target: [0]
      allow_publishers: true

events:
  - at: 0
    type: put
    host: 0
    uri: "ccnx:/m5a/data"
    file: "./sample-putfile"

  # Repeated eval gets: hosts 1, 2, 3 each poll ccnx:/m5a/data every 5s from
  # t=10 to t=70 (13 occurrences: 10,15,...,70). This window straddles the
  # publisher-down interval [30,60], so ~6 of the 13 hits per host occur while
  # host 0 is down.
  - at: 10
    type: get
    host: 1
    uri: "ccnx:/m5a/data"
    repeat:
      interval: 5
      count: 13
  - at: 10
    type: get
    host: 2
    uri: "ccnx:/m5a/data"
    repeat:
      interval: 5
      count: 13
  - at: 10
    type: get
    host: 3
    uri: "ccnx:/m5a/data"
    repeat:
      interval: 5
      count: 13
