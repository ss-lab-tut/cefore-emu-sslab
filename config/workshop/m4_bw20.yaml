# =============================================================================
# M4: bandwidth-fidelity sweep, 20 Mbps variant.
# Usage: sudo .venv/bin/python3 -m src disaster --config config/workshop/m4_bw20.yaml --no-cli
# Driven by tools/autotest/run.py (overrides seed/num); values below are placeholders.
#
# Sibling files m4_bw10/bw20/bw50/bw100.yaml are identical to this one except
# for the `bandwidth` value on the bw_set event -- keep the topology/put/get
# sections mirrored there so the five form a clean single-variable
# bandwidth-fidelity comparison.
#
# Intended wall-clock duration: 90s. Last scheduled event fires at t=50,
# leaving a 40s tail.
#
# BANDWIDTH KEY CHOSEN: this campaign uses a `bw_set` *event* (host-index
# pair [0,1], applied once at t=1) rather than the static top-level `bw:`
# list shown in config/examples/disaster_bandwidth.yaml. The static `bw:`
# list needs literal switch names (e.g. "h0,s5,10"), which are assigned in
# switch-creation order by src/runtime/topo.py's MeshTopo.build() and are
# therefore just as seed-dependent as a link_down pair -- but *unknowable*
# ahead of time since we never see the generated topology (tools/autotest/
# run.py overrides the seed and this task deliberately avoids running
# Mininet). A `bw_set` event only needs two HOST indices to share some
# switch (resolved at runtime via src/runtime/bandwidth.py's
# set_switch_bandwidth -> find_link), which is far more likely for a small,
# reasonably dense 5-host mesh than guessing a specific switch name. If [0,1]
# do NOT share a switch for a given seed, set_switch_bandwidth() logs
# "[bw] no shared switch between h0 and h1" and returns False (no
# exception) -- the scheduler records a failed bw_set outcome and continues;
# the run does not crash, it just silently keeps the link at Mininet's
# unbounded default bandwidth for that run.
# =============================================================================

hosts: 5
switches: 8
seed: 42                # placeholder; overridden by run.py
k: 2
host_degree_min: 2      # denser-than-minimum degree raises the odds h0-h1 share a switch
host_degree_max: 4

num: 1                  # placeholder; overridden by run.py
output_dir: "logs"
no_cli: true
duration: 90
results_json: "results.json"
# 2026-07-08 update: ADR-0002 で down_interval/down_duration の default が 0/0 に
# なったため、down_* キーを省略しても host flapping は有効化されない（旧 default
# 30/5 が 2026-07-07 の暗黙 flap 事故の原因だった）。以下の明示ゼロは「failure なし」
# を意図した設定であることを示す自己文書化として残す。
down_interval: 0
down_duration: 0
down_count: 0

# No failure_scenarios / down_interval: bandwidth fidelity is measured on a
# healthy network, isolated from disaster-flap noise.

events:
  - at: 0
    type: put
    host: 0
    uri: "ccnx:/m4/data"
    file: "./sample-putfile"

  # Static-like bandwidth cap: set once, right after put, and left in place
  # for the rest of the run (see file header for why bw_set-event beats the
  # static `bw:` list here).
  - at: 1
    type: bw_set
    nodes: [0, 1]
    bandwidth: 20           # Mbps -- sweep variable for this file

  - at: 20
    type: get
    host: 1
    uri: "ccnx:/m4/data"
  - at: 35
    type: get
    host: 2
    uri: "ccnx:/m4/data"
  - at: 50
    type: get
    host: 3
    uri: "ccnx:/m4/data"
