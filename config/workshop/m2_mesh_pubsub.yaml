# =============================================================================
# M2: mesh topology x pub/sub command matrix (no failures)
# Usage: sudo .venv/bin/python3 -m src disaster --config config/workshop/m2_mesh_pubsub.yaml --no-cli
# Driven by tools/autotest/run.py (overrides seed/num); values below are placeholders.
#
# Intended wall-clock duration: 90s. Last scheduled event fires at t=40,
# leaving a 50s tail.
# =============================================================================

hosts: 5
switches: 8
seed: 42                # placeholder; overridden by run.py
k: 2
host_degree_min: 2
host_degree_max: 3

num: 1                  # placeholder; overridden by run.py
output_dir: "logs"
no_cli: true
duration: 90
results_json: "results.json"
# 2026-07-07 fix: down_* キーは省略すると default が down_interval=30/down_count=5
# で host flapping が有効になる（smoke 実測: [flap] down h1 が発生し get が失敗）。
# 「failure なし」を意図する config は必ず明示的にゼロを指定すること。
down_interval: 0
down_duration: 0
down_count: 0
# 実証済み min_event_pubsub.yaml と同じ grace（sub 起動から pub 送信までの猶予）
pubsub_sub_startup_grace: 2.0

# No failure_scenarios / down_interval: healthy-network pub/sub baseline,
# counterpart to m2_mesh_putget.yaml.

# 2026-07-07 SCALE FIX: 15h/48sw では pubsub が系統的に失敗する (pub が
# Trigger Interest を受けられず deadline 23s で terminate — m1_repro/m2_disaster
# の 15-host 実測、隣接 sub でも再現)。5h/8sw (m1_smoke と同形状) では成功する
# ことが実証済みのため、M2 の pubsub 行はこの規模で計測する。15-host での失敗
# 自体は「エミュレータが Cefore 本体の pubsub スケール問題を再現性つきで検出」
# として m2_disaster の結果に残る (CONTEXT.md 参照)。
events:
  # Round 1: publisher h0, three subscribers wake up before the publish so
  # they are already blocked on cefsubfile when the Trigger Interest lands
  # (same `at` as the pubsub_pub -> sub is guaranteed to start first, per
  # scheduler priority: pubsub_sub=0, pubsub_pub=2).
  - at: 10
    type: pubsub_sub
    host: 1
    uri: "ccnx:/m2/pubsub/stream1"
    sub_opts:
      wait: 20
  - at: 10
    type: pubsub_sub
    host: 2
    uri: "ccnx:/m2/pubsub/stream1"
    sub_opts:
      wait: 20
  - at: 10
    type: pubsub_sub
    host: 3
    uri: "ccnx:/m2/pubsub/stream1"
    sub_opts:
      wait: 20
  - at: 10
    type: pubsub_pub
    host: 0
    uri: "ccnx:/m2/pubsub/stream1"
    file: "./sample-putfile"
    pub_opts:
      lifetime: 8

  # Round 2: same publisher, different URI/subscribers, scheduled well after
  # round 1 has resolved -- spreads pub/sub evals across the run duration.
  - at: 40
    type: pubsub_sub
    host: 4
    uri: "ccnx:/m2/pubsub/stream2"
    sub_opts:
      wait: 20
  - at: 40
    type: pubsub_sub
    host: 1
    uri: "ccnx:/m2/pubsub/stream2"
    sub_opts:
      wait: 20
  - at: 40
    type: pubsub_sub
    host: 2
    uri: "ccnx:/m2/pubsub/stream2"
    sub_opts:
      wait: 20
  - at: 40
    type: pubsub_pub
    host: 0
    uri: "ccnx:/m2/pubsub/stream2"
    file: "./sample-putfile"
    pub_opts:
      lifetime: 8
