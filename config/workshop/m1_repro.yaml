# =============================================================================
# M1 REPRODUCIBILITY FLAGSHIP
# Usage: sudo .venv/bin/python3 -m src disaster --config config/workshop/m1_repro.yaml --no-cli
# Driven by tools/autotest/run.py, which overrides `seed` and `num` per run
# (same-seed x10 to measure determinism, then different-seed x20 to measure
# topology-to-topology variance) -- the seed/num values below are placeholders.
#
# Intended wall-clock duration for this run: 90s (--duration passed by run.py
# should be >= 90; the last scheduled event below fires at t=70, leaving a
# 20s tail so in-flight cefgetfile/cefsubfile calls can finish before teardown).
# =============================================================================

# -----------------------------------------------------------------------------
# Topology: full-size mesh, mirrors config/examples/example.yaml's proven
# hosts=15/switches=48/host_degree(2..6) combination (empirically known to
# build successfully -- see src/runtime/topo.py's spanning-tree degree-budget
# check, which needs sum(degree) >= 2*(hosts-1)).
# -----------------------------------------------------------------------------
hosts: 15
switches: 48
seed: 42               # placeholder; tools/autotest/run.py overrides this per run
k: 2
host_degree_min: 2
host_degree_max: 6

# -----------------------------------------------------------------------------
# Output / execution control
# -----------------------------------------------------------------------------
num: 1                 # placeholder; tools/autotest/run.py overrides this per run
output_dir: "logs"
no_cli: true            # required for unattended overnight batch runs
duration: 90            # eval-phase seconds after events finish (no_cli path)
results_json: "results.json"   # required: without it the success-rate analyzer sees no data
# 2026-07-07 fix: down_* キーは省略すると default が down_interval=30/down_count=5
# で host flapping が有効になる（smoke 実測: [flap] down h1 が発生し get が失敗）。
# 「failure なし」を意図する config は必ず明示的にゼロを指定すること。
down_interval: 0
down_duration: 0
down_count: 0
# 実証済み min_event_pubsub.yaml と同じ grace（sub 起動から pub 送信までの猶予）
pubsub_sub_startup_grace: 2.0

# Intentionally NO failure_scenarios / down_interval here: M1's purpose is to
# isolate seed-reproducibility noise from disaster-flap noise, so the network
# stays fully up for the whole run.

# -----------------------------------------------------------------------------
# Events
# -----------------------------------------------------------------------------
# Publisher is host 0 for both put and pubsub_pub, so hosts 1-14 are all
# non-publisher and eligible for the eval-get requirement below.
events:
  # Publish the primary dataset immediately.
  - at: 0
    type: put
    host: 0
    uri: "ccnx:/m1/data"
    file: "./sample-putfile"        # ~423KB repo test asset, reused from existing configs

  # Eval gets: 3 distinct non-publisher hosts, staggered so results.json
  # captures independent get attempts spread across the run.
  - at: 20
    type: get
    host: 1
    uri: "ccnx:/m1/data"
  - at: 30
    type: get
    host: 2
    uri: "ccnx:/m1/data"
  - at: 40
    type: get
    host: 3
    uri: "ccnx:/m1/data"

  # Repeated get: same host, 3 repetitions 10s apart (t=50,60,70) -- exercises
  # cache/RCT behavior over time. `repeat.count` is the TOTAL number of
  # executions (see src/runtime/scheduler.py:_handle_repeat), not "extra"
  # repeats on top of the first, so count:3 gives exactly t=50/60/70.
  - at: 50
    type: get
    host: 4
    uri: "ccnx:/m1/data"
    repeat:
      interval: 10
      count: 3

  # 2026-07-07 fix: pubsub は全 get の後ろ（最終 repeat get t=70 の後）に配置。
  # 早期発火 (at<=2) では pub がログ 0B のまま SIGTERM する失敗を smoke で確認。
  # また pub は grace+sub 待ちで content worker を ~20s 占有し、get の前に置くと
  # repeat get の間隔が崩れる（実測）。sub は t=72+2(grace)+20(wait)=~94 で完了
  # するため、campaign manifest はこの config に duration>=110 を渡すこと。
  # host は変更しない（publisher_ids が topology fingerprint に影響するため）。
  - at: 72
    type: pubsub_sub
    host: 5
    uri: "ccnx:/m1/stream"
    sub_opts:
      wait: 20                      # cefsubfile listens this long for the Trigger Interest
  - at: 72
    type: pubsub_pub                # same `at` as the sub above -> sub is guaranteed to start first
    host: 0
    uri: "ccnx:/m1/stream"
    file: "./sample-putfile"
    pub_opts:
      lifetime: 8
