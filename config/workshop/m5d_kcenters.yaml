# =============================================================================
# M5d: cache-strategy comparison, k_centers variant.
# Usage: sudo .venv/bin/python3 -m src disaster --config config/workshop/m5d_kcenters.yaml --no-cli
# Driven by tools/autotest/run.py (overrides seed/num); values below are placeholders.
#
# Modeled on config/examples/flexible_cache.yaml's 12h/25sw topology.
# Sibling files m5d_degree.yaml / m5d_manual.yaml are identical to this one
# except for the cache_config block -- keep the topology/failure/events
# sections mirrored there so the three form a clean single-variable
# comparison of cache node SELECTION strategy.
#
# Intended wall-clock duration: 150s. Last scheduled event fires at t=120,
# leaving a 30s tail.
# =============================================================================

hosts: 15
switches: 48
seed: 77                # placeholder; overridden by run.py (77 mirrors flexible_cache.yaml's default)
k: 2
# 2026-07-07 fix: 12h/25sw + default degree(1..2) では大半の seed で spanning tree 構築失敗
# (degree budget exhausted)。m5c と同一の topology 条件に揃えて seed 歩留まりを確保。
host_degree_min: 2
host_degree_max: 6

num: 1                  # placeholder; overridden by run.py
output_dir: "logs"
no_cli: true
duration: 150
results_json: "results.json"

# k_centers: greedy farthest-first selection (publisher excluded automatically
# by the disaster scenario's cache-strategy builder).
cache_config:
  strategy: "k_centers"
  default:
    count: 3
    capacity: 819200
    default_rct_ms: 1800000
    algorithm: "LRU"
    type: "memory"

# Same moderate failure cycle in all three m5d_*.yaml variants: 2 hosts down
# per 30s cycle for 15s, publisher (host 0) excluded.
failure_scenarios:
  strategy: "simple"
  simple:
    interval: 30
    duration: 15
    count: 2
    exclude: [0]

events:
  - at: 0
    type: put
    host: 0
    uri: "ccnx:/m5d/data"
    file: "./sample-putfile"

  - at: 20
    type: get
    host: 1
    uri: "ccnx:/m5d/data"
  - at: 50
    type: get
    host: 4
    uri: "ccnx:/m5d/data"
  - at: 80
    type: get
    host: 7
    uri: "ccnx:/m5d/data"

  # Repeated eval get: every 15s from t=90 to t=120 (3 occurrences).
  - at: 90
    type: get
    host: 10
    uri: "ccnx:/m5d/data"
    repeat:
      interval: 15
      count: 3
