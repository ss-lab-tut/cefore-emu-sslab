# イベント指定 put/get の最小サンプル
# hosts がフラッピングしている間に put/get を実行する例
# Usage: sudo .venv/bin/python3 -m src disaster --config config/examples/min_event_putget.yaml
hosts: 3
switches: 3
seed: 42
k: 1
down_interval: 0
down_count: 0
num: 9910
output_dir: "logs/verify"
no_cli: true
duration: 40
results_json: "results.json"

# events: セクションで時刻を指定して put/get を実行
events:
  - {at: 5,  type: put,  host: 2, uri: "ccnx:/test/event_sample", file: "./sample-putfile"}
  - {at: 15, type: get,  host: 0, uri: "ccnx:/test/event_sample"}
