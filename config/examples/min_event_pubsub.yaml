# イベント指定 pub/sub の最小サンプル
# events: セクションで時刻を指定して pubsub_sub → pubsub_pub を実行する例
# Usage: sudo .venv/bin/python3 -m src disaster --config config/examples/min_event_pubsub.yaml
#
# pubsub_sub は pubsub_pub より先に実行される（同じ at 時刻でも自動的に sub が先）。
# pubsub_sub_startup_grace が経過してから pubsub_pub が送信される。
hosts: 3
switches: 3
seed: 42
k: 1
down_interval: 0
down_count: 0
num: 9911
output_dir: "logs/verify"
no_cli: true
duration: 45
results_json: "results.json"
publisher_host: 2
pubsub_sub_startup_grace: 2.0

events:
  # 同じ at=10 でも pubsub_sub が先に起動される（優先度制御）
  - at: 10
    type: pubsub_sub
    host: 0
    uri: "ccnx:/test/event_stream"
    sub_opts:
      wait: 20

  - at: 10
    type: pubsub_pub
    host: 2
    uri: "ccnx:/test/event_stream"
    file: "./sample-putfile"
    pub_opts:
      lifetime: 8
