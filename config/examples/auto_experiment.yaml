# =============================================================================
# auto_experiment.yaml
# Auto生成機能を使った自動実験の設定例
#
# puts/gets を手動で定義せず、auto セクションで自動生成する。
# 実行例:
#   sudo .venv/bin/python3 -m src disaster --config config/examples/auto_experiment.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# トポロジ設定
# -----------------------------------------------------------------------------
hosts: 5                     # ホスト数
switches: 9                  # スイッチ数
seed: 42                     # 乱数シード
k: 4                         # 宛先あたりの最短パス数

# -----------------------------------------------------------------------------
# ルーティング戦略
# -----------------------------------------------------------------------------
# routing:
#   strategy: "dijkstra"     # dijkstra / shortest_path / ecmp

# -----------------------------------------------------------------------------
# Auto生成（puts/gets の自動生成）
# -----------------------------------------------------------------------------
auto:
  publishers: [4]              # パブリッシャーホストIDリスト（hosts 範囲内であること）
  consumers: "random:5"        # コンシューマー: "random:N" またはリスト [0, 1, 2]
  content_count: 5             # パブリッシャーあたりコンテンツ数
  uri_prefix: "ccnx:/test/experiment"  # URIプレフィックス（putget形式）
  consumer_per_content: 4      # コンテンツあたりの get 操作数

# -----------------------------------------------------------------------------
# ノード故障シミュレーション（旧方式）
# -----------------------------------------------------------------------------
# 注意: failure_scenarios を使うとより柔軟な制御が可能（example.yaml 参照）
down_interval: 30              # ダウンイベント間隔（秒, 0で無効）
down_duration: 10              # ホストダウン維持時間（秒）
down_stagger: 5                # サイクル内の個別ダウン間隔（秒）
down_count: 2                  # サイクルあたりダウンホスト数

# -----------------------------------------------------------------------------
# 実行制御
# -----------------------------------------------------------------------------
get_interval: 5                # get操作間の間隔（秒）
topo_layout: "spring"          # トポロジ画像レイアウト
