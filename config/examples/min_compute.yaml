# compute_call の tri-state outcome 最小サンプル
# Usage: sudo .venv/bin/python3 -m src disaster --config config/examples/min_compute.yaml
#
# 外部到達性なし（bridges/ext 未設定 — autotest mode では設定禁止）で実行し、
# endpoint 到達不能 → 実験失敗ではなく環境要因として
# outcome=skipped-no-result が results.json に記録されることを検証する。
# 到達不能の保証は topology isolation（autotest mode に外部経路が無いこと）で、
# RFC 5737 (TEST-NET-3) はその上で「万一経路があっても実サービスに当たらない」
# 安全側の選択にすぎない。
#
# ok 経路（実 HTTP → output_file 保存 → publish_uri で ICN 再publish → 他ノード get）
# の手動確認手順（autotest mode は bridges 禁止なので、このファイルをコピーして
# no_cli と results_json を外し、CLI モードで実行する。イベントは bridge 作成の
# 数秒後に発火するため、at: 3 のままではサーバ起動が間に合わない — at: 60 に遅らせ、
# bridge アドレス出現を待ってからサーバを立てる）:
#   1. コピーを編集:
#      - bridges を追記（switch は整数 index、local_routes は必須。root_ip: auto
#        で当該スイッチのサブネット内 .254 が root 側に付き、ホスト側の追加ルート
#        無しで到達できる。seed=42 では s0 のサブネットは 192.168.1.0/24）:
#          bridges:
#            - {switch: 0, root_ip: "auto", local_routes: "192.168.0.0/16"}
#      - events の compute_call を at: 60 に変更し、endpoint を root ns 側サーバに:
#          endpoint: "http://192.168.1.254:18080/"
#          method: GET   （http.server は POST に 501 を返すため。payload/headers は削除）
#   2. 端末A: sudo .venv/bin/python3 -m src disaster --config <コピー>
#   3. 端末B: bridge アドレスが付いたら（起動後数秒）サーバを起動 — t=60 発火前に立つ:
#        until ip -o addr show | grep -q 192.168.1.254; do sleep 1; done
#        .venv/bin/python3 -m http.server 18080 --bind 192.168.1.254
#   4. t=60 経過後、端末Aの CLI で h0 から取得し、バイト一致まで確認:
#        h0 cefgetfile ccnx:/compute/result1 -f /tmp/r1 -d ./h0
#        h0 diff /tmp/r1 <run_dir>/compute_result.json   （差分なしなら成功）
hosts: 3
switches: 3
seed: 42
k: 1
num: 9910
output_dir: "logs/verify"
no_cli: true
duration: 15
results_json: "results.json"

events:
  - at: 3
    type: compute_call
    host: 1
    endpoint: "http://203.0.113.1:8080/api/process"
    method: POST
    payload: '{"query": "analyze"}'
    headers: {"Content-Type": "application/json"}
    output_file: "compute_result.json"
    publish_uri: "ccnx:/compute/result1"
    pub_opts: {expiry: 5000, cache_time: 5000}
    timeout: 3
