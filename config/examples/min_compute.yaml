# compute_call の tri-state outcome 最小サンプル
# Usage: sudo .venv/bin/python3 -m src disaster --config config/examples/min_compute.yaml
#
# 外部到達性なし（bridges/ext 未設定 — autotest mode では設定禁止）で実行し、
# endpoint 到達不能 → 実験失敗ではなく環境要因として
# outcome=skipped-no-result が results.json に記録されることを検証する。
# 到達不能の保証は topology isolation（autotest mode に外部経路が無いこと）で、
# RFC 5737 (TEST-NET-3) はその上で「万一経路があっても実サービスに当たらない」
# 安全側の選択にすぎない。
#
# ok 経路（実 HTTP → output_file 保存 → publish_uri で ICN 再publish → 他ノード get）は
# root 限定の product test で自動検証する（tests/synthetic/test_compute_ok_path_synthetic.py、
# HPC を endpoint にする _hpc.py）。手順と手動確認の代替は docs/runbooks/compute-ok-path.md。
hosts: 3
switches: 3
seed: 42
k: 1
num: 9910
output_dir: "logs/verify"
no_cli: true
duration: 15
results_json: "results.json"

events:
  - at: 3
    type: compute_call
    host: 1
    endpoint: "http://203.0.113.1:8080/api/process"
    method: POST
    payload: '{"query": "analyze"}'
    headers: {"Content-Type": "application/json"}
    output_file: "compute_result.json"
    publish_uri: "ccnx:/compute/result1"
    pub_opts: {expiry: 5000, cache_time: 5000}
    timeout: 3
