# =============================================================================
# autotest_minimal.yaml
# 最小構成の自動テスト用設定例
#
# 最小限のパラメータで動作確認を行うための設定。
# 4ホスト、6スイッチの小規模トポロジで単一コンテンツの put/get を実行する。
# 実行例:
#   sudo .venv/bin/python3 -m src disaster --config config/examples/autotest_minimal.yaml --no-cli
# =============================================================================

# -----------------------------------------------------------------------------
# トポロジ設定
# -----------------------------------------------------------------------------
hosts: 4                       # ホスト数（最小3）
switches: 6                    # スイッチ数
seed: 100                      # 乱数シード
k: 2                           # 宛先あたりの最短パス数

# -----------------------------------------------------------------------------
# コンテンツ配信設定
# -----------------------------------------------------------------------------
events:
  - {at: 5, type: put, host: 3, uri: "ccnx:/test/sample1", file: "./sample-putfile"}
  - {at: 10, type: get, host: 0, uri: "ccnx:/test/sample1"}
