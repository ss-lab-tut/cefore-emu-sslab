# =============================================================================
# autotest_hot.yaml
# ホットコンテンツ + ウォームアッププリフェッチの自動テスト設定例
#
# put → warmup(get to cache nodes) → flap → eval(get) の流れでテスト。
# キャッシュにコンテンツを事前配置した状態でのキャッシュヒット率を評価する。
#
# 実行例:
#   sudo .venv/bin/python3 -m src disaster \
#     --config config/examples/autotest_hot.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# トポロジ設定
# -----------------------------------------------------------------------------
hosts: 6
switches: 10
seed: 42
k: 2

# -----------------------------------------------------------------------------
# ウォームアップ設定
# -----------------------------------------------------------------------------
warmup_get_interval: 1
warmup_only_cache_nodes: true

# -----------------------------------------------------------------------------
# コンテンツ配信設定 (events only)
# -----------------------------------------------------------------------------
events:
  # Put: 2つのホットコンテンツを配信
  - at: 3
    type: put
    host: 5
    uri: "ccnx:/test/hot/content1"
    file: "./sample-putfile"
    cache_time: 5000
    expiry: 5000

  - at: 3
    type: put
    host: 5
    uri: "ccnx:/test/hot/content2"
    file: "./sample-putfile"
    cache_time: 5000
    expiry: 5000

  # Eval: 定期的に取得（publisher down 時のキャッシュヒット率を評価）
  - at: 10
    type: get
    host: 0
    uri: "ccnx:/test/hot/content1"
    repeat: {interval: 15, count: 8}

  - at: 10
    type: get
    host: 1
    uri: "ccnx:/test/hot/content2"
    repeat: {interval: 15, count: 8}

# -----------------------------------------------------------------------------
# 障害シミュレーション設定
# -----------------------------------------------------------------------------
failure_scenarios:
  strategy: simple
  simple:
    interval: 20
    duration: 10
    count: 1
    stagger: 0
    exclude: [5]   # publisher を除外

# -----------------------------------------------------------------------------
# キャッシュ設定
# -----------------------------------------------------------------------------
cache_default_rct_ms: 60000

# -----------------------------------------------------------------------------
# 自動テストモード
# -----------------------------------------------------------------------------
no_cli: true
duration: 180
results_json: "results.json"

# -----------------------------------------------------------------------------
# 出力設定
# -----------------------------------------------------------------------------
num: 1
output_dir: "logs"
timestamp: false
