# 最小検証用: 障害サイクル (host_down/host_up) の outcome record 証拠
# Usage: sudo .venv/bin/python3 -m src disaster --config config/examples/min_failure.yaml
#
# 障害中の get はトポロジ次第で正当に失敗しうるため、checker は
# サイクル証拠（host_down/host_up event record の存在と成功）のみを検証する。
# publisher (h2) は自動で down 対象外、h0 は down_exclude で除外 → h1 が flap する。
hosts: 3
switches: 6
seed: 42
k: 2
down_interval: 4
down_duration: 3
down_count: 1
down_exclude: "0"
num: 9912
output_dir: "logs/verify"
no_cli: true
duration: 12
results_json: "results.json"
publisher_host: 2

events:
  - at: 0
    type: put
    host: 2
    uri: "ccnx:/test/failure"
    file: "./sample-putfile"
    expiry: 3000
    cache_time: 3000
