# disaster_bandwidth.yaml
# 帯域劣化・計算資源API・Pluggableルーティングの設定例
#
# 実行例:
#   sudo python3 -m src disaster --config config/examples/disaster_bandwidth.yaml

# --- トポロジ設定 ---
hosts: 8                    # ホスト数（最小3）
switches: 12                # スイッチ数（最小2）
seed: 42                    # 乱数シード（再現性のため）
k: 3                        # 宛先あたりの最大ネクストホップ数

# --- 出力設定 ---
output_dir: "logs"          # 出力ディレクトリ
timestamp: true             # ディレクトリ名にタイムスタンプを付与
topo_png: "topology.png"    # トポロジ画像の出力パス
topo_layout: "spring"       # レイアウト: spring, kamada_kawai, circular

# --- ルーティング戦略 ---
# dijkstra: デフォルト、k本の最良ネクストホップ
# shortest_path: 最短経路1本のみ（k=1固定）
# ecmp: 等コスト全ネクストホップ（kは無視）
routing:
  strategy: "dijkstra"      # dijkstra / shortest_path / ecmp
  # k: 3                    # ルーティング専用のk値（省略時はトップレベルのkを使用）

# --- 静的帯域設定（起動時に適用） ---
# "ノードA,ノードB,Mbps" 形式
bw:
  - "h0,s0,10"              # h0-s0 間を 10Mbps に設定
  - "h7,s11,5"              # h7-s11 間を 5Mbps に設定

# --- イベントスケジューラ ---
# at: 開始からの秒数
# type: イベント種別
# repeat: 繰り返し設定（オプション）
events:
  # 一発ものの帯域変更: 15秒後に h0-h3 間の共有スイッチ全体を 5Mbps に
  - at: 15
    type: bw_set
    nodes: [0, 3]           # ホストインデックスのペア
    bandwidth: 5            # Mbps

  # 周期的帯域劣化: 30秒目から開始
  - at: 30
    type: bw_set
    nodes: [1, 5]
    bandwidth: 1            # 劣化時の帯域（1Mbps）
    repeat:
      interval: 30          # 30秒ごとに繰り返す
      duration: 10          # 10秒後に復元
      restore:
        bandwidth: 10       # 復元時の帯域（10Mbps）
      count: 5              # 5回繰り返し（nullで無限）

  # 周期的リンク断: 60秒目から3回
  - at: 60
    type: link_down
    nodes: [2, 4]
    repeat:
      interval: 45          # 45秒間隔
      duration: 15          # 15秒後に復旧
      restore_type: link_up # 復旧イベントの種別
      count: 3

  # FIBルート追加: 20秒後
  - at: 20
    type: fib_add
    host: 3
    prefix: "ccnx:/test/example1"
    protocol: udp
    next_hop: "192.168.1.1"

  # 計算資源API呼び出し（外部APIが利用可能な場合のみ有効）
  # bridges設定で外部ネットワークへの到達性を確保する必要あり
  # - at: 20
  #   type: compute_call
  #   host: 3                            # キャッシュノード ID
  #   endpoint: "http://10.0.0.100:8080/api/process"
  #   method: POST
  #   payload: '{"query": "analyze"}'
  #   output_file: "compute_result.json" # run_dir 配下に保存
  #   timeout: 30
  #   # publish_uri: "ccnx:/compute/result1"  # 結果をCeforeで配信（オプション）

# --- ノード故障シミュレーション ---
failure_scenarios:
  strategy: "cyclic"        # simple / cyclic / random / manual
  cycles:
    # サイクル1: 30秒後に2ノードダウン、10秒後に復旧
    - interval: 30
      duration: 10
      count: 2
      exclude: [7]          # パブリッシャーを明示的に除外

    # サイクル2: 60秒後に1ノードダウン、15秒後に復旧
    - interval: 60
      duration: 15
      count: 1

# --- キャッシュ設定 ---
cache_config:
  strategy: "k_centers"     # k_centers / manual / degree_based
  default:
    count: 3                # キャッシュノード数
    capacity: 100000        # キャッシュ容量
    default_rct_ms: 5000    # デフォルトRCT（ミリ秒、最小1000）
    algorithm: "LRU"        # LRU / LFU / FIFO / None
    type: "memory"          # memory / filesystem
  # ノード個別設定（オプション）
  # nodes:
  #   - id: [3, 5]
  #     capacity: 200000
  #     algorithm: "LFU"

# --- コンテンツ配信設定 ---
puts:
  - host: 7                 # パブリッシャーホスト
    uri: "ccnx:/test/video1"
    file: "./sample-putfile"
    rate: 10                # 転送レート（Mbps）
    expiry: 5000            # コンテンツ有効期限（秒）
    cache_time: 5000        # キャッシュ保持期間（秒）

gets:
  - host: 0
    uri: "ccnx:/test/video1"
  - host: 2
    uri: "ccnx:/test/video1"
  - host: 4
    uri: "ccnx:/test/video1"

# --- ウォームアップ設定 ---
warmup_get_interval: 3      # ウォームアップ取得間隔（秒）
warmup_only_cache_nodes: true  # キャッシュノードのみでウォームアップ
hot_uris:
  - "ccnx:/test/video1"    # プリキャッシュ対象URI

# --- 監視設定 ---
monitoring:
  interval: 5               # 収集間隔（秒）
  output_json: "monitor.json"
  output_csv: "monitor.csv"
  targets:
    - type: cefstatus
      hosts: "all"
    - type: csmgrstatus
      hosts: "cache"

# --- 自動実験モード ---
# no_cli: true              # CLIなしで実行
# duration: 120             # 実験時間（秒）
# results_json: "results.json"  # 結果JSONの出力パス
get_interval: 5             # get操作間の間隔（秒）
