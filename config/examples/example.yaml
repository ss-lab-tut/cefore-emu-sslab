# =============================================================================
# CeforeEmu 設定ファイル (全パラメータ記載)
# Usage: sudo .venv/bin/python3 -m src disaster --config config/examples/example.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# トポロジ基本設定
# -----------------------------------------------------------------------------
hosts: 15               # ホスト数 (>=3)
switches: 48            # スイッチ数 (>=2, 最大 n*(n-1)/2)
seed: 42               # 乱数シード (null でランダム)
k: 2                   # 宛先ごとの最短パス数 (マルチパスルーティング)
host_degree_min: 2     # ホストあたり最小スイッチ接続数 (>=1)
host_degree_max: 5     # ホストあたり最大スイッチ接続数 (>= host_degree_min)
switch_use_all: false   # true: --switches個までスイッチを作り余分なリンクを均等配分
node_per_switch: 2     # スイッチあたり最大ホスト数 (0=無制限, 2=リンクごとに1スイッチ)

# -----------------------------------------------------------------------------
# 出力設定
# -----------------------------------------------------------------------------
num: 4                         # 実験番号 (ログディレクトリ出力を有効化, null で無効)
output_dir: "logs"             # ベース出力ディレクトリ
timestamp: true              # true: 出力ディレクトリ名にタイムスタンプ付与
topo_png: "topology.png"       # トポロジPNG出力パス (null で出力しない)
topo_layout: "kamada_kawai"    # レイアウト: spring / kamada_kawai / circular
script_log: "script.log"       # スクリプトログファイル名 (null でデフォルト名)
no_script_log: false           # true: スクリプトログ出力を無効化

# -----------------------------------------------------------------------------
# 災害シミュレーション (ホスト障害)
# -----------------------------------------------------------------------------
down_interval: 60      # ダウンイベント間隔 (秒, 0で無効)
down_duration: 120      # ホストダウン維持時間 (秒)
down_count: 2          # サイクルあたりダウンホスト数
down_stagger: 2        # サイクル内の個別ダウン間隔 (秒)
# down_exclude: "0,4"    # ダウン対象から除外するホストID (カンマ区切り)
down_exclude: "0"

# -----------------------------------------------------------------------------
# キャッシュ設定 (レガシー: cache_count + cache_default_rct_ms)
# -----------------------------------------------------------------------------
cache_count: 0                 # キャッシュノード数 (0 = down_count + 1)
cache_default_rct_ms: 10000    # キャッシュノードの CACHE_DEFAULT_RCT (ミリ秒, >=1000)

# -----------------------------------------------------------------------------
# キャッシュ設定 (拡張: cache_config)
# cache_config を指定すると cache_count/cache_default_rct_ms より優先される
# -----------------------------------------------------------------------------
# cache_config:
#   strategy: "k_centers"        # k_centers: 重心ベース / manual: 手動 / degree_based: 次数ベース
#   default:
#     count: 3                   # キャッシュノード数
#     capacity: 819200           # CACHE_CAPACITY (bytes)
#     default_rct_ms: 1800000    # CACHE_DEFAULT_RCT (ミリ秒, >=1000)
#     algorithm: "LRU"           # CACHE_ALGORITHM: LRU / LFU / FIFO / None
#     type: "memory"             # CACHE_TYPE: memory / filesystem
#   nodes:                       # ノード個別設定（オプション）
#     - id: [3, 5]
#       capacity: 1638400
#       algorithm: "LFU"
#     - id: [7]
#       capacity: 204800
#       default_rct_ms: 900000

# -----------------------------------------------------------------------------
# ルーティング戦略
# -----------------------------------------------------------------------------
# routing:
#   strategy: "dijkstra"         # dijkstra: k本最良ネクストホップ（デフォルト）
#                                # shortest_path: 最短経路1本のみ（k=1固定）
#                                # ecmp: 等コスト全ネクストホップ（k無視）
#   k: 3                         # ルーティング専用のk値（省略時はトップレベルの k を使用）

# -----------------------------------------------------------------------------
# ノード故障シミュレーション (拡張: failure_scenarios)
# failure_scenarios を指定すると down_interval/down_duration 等より優先される
# -----------------------------------------------------------------------------
failure_scenarios:
  strategy: "cyclic"           # simple / cyclic / random / manual
  simple:                      # simple 戦略用
    interval: 30
    duration: 10
    count: 2
    stagger: 2
    exclude: [0, 4]
  cycles:                    # cyclic/random/manual 戦略用
    - interval: 30
      duration: 10
      count: 2
      exclude: [4]
    - interval: 60
      duration: 15
      count: 1
  #     target: [1, 3]         # manual 戦略: 対象ホスト指定
      allow_publishers: false

# -----------------------------------------------------------------------------
# イベントスケジューラ (時限イベント)
# -----------------------------------------------------------------------------
# ネットワーク系イベント type: link_down, link_up, fib_add, fib_del, fib_enable,
#                              bw_set, compute_call
# コンテンツ操作イベント type: put, get, pubsub_pub, pubsub_sub
#   put       : host, uri, file が必須。フラッピング中など任意のタイミングで put。
#   get       : host, uri が必須。results.json に記録される。
#   pubsub_sub: host, uri が必須。sub_opts (wait 等) で購読待機時間を指定。
#   pubsub_pub: host, uri, file が必須。pub_opts (lifetime 等) を指定可能。
#               同じ at 時刻に pubsub_sub と pubsub_pub を書いた場合、sub が先に起動される。
#               起動後 pubsub_sub_startup_grace 秒待ってから pub が送信される。
#
# repeat: 繰り返し設定（全イベントタイプで使用可能）
#   interval: 繰り返し間隔（秒）
#   duration: restore イベントまでの時間（秒）
#   restore:  復元時に上書きするフィールド（dict）
#   restore_type: 復元イベントの type（例: link_up）
#   count:    繰り返し回数（null で無限）
events:
  # 注意: nodes のペアはトポロジ上に存在するリンクでなければならない。
  # topo_png の画像や起動ログの adjacency matrix で実際のリンクを確認すること。
  - at: 15                       # 開始から15秒後
    type: link_down              # リンクダウン
    nodes: [0, 1]                # h0-h1 間 (seed=42 で s5 経由)
  - at: 25
    type: link_up
    nodes: [0, 1]
  - at: 30
    type: fib_del                # FIBエントリ削除
    host: 3
    prefix: "ccnx:/test/sample"
    protocol: udp
    next_hop: "192.168.1.1"
  - at: 40
    type: fib_add                # FIBエントリ追加
    host: 3
    prefix: "ccnx:/test/sample"
    protocol: udp
    next_hop: "192.168.1.1"
  - at: 50
    type: fib_enable             # FIBエントリ有効化
    host: 3
    prefix: "ccnx:/test/sample"
    protocol: udp
    next_hop: "192.168.1.1"
  - at: 60
    type: bw_set                 # 帯域変更（共有スイッチ全体に適用）
    nodes: [0, 3]                # ホストインデックスのペア
    bandwidth: 5                 # Mbps
  - at: 70
    type: bw_set                 # 周期的帯域劣化（repeat付き）
    nodes: [1, 5]
    bandwidth: 1
    repeat:
      interval: 30               # 30秒ごとに繰り返し
      duration: 10               # 10秒後に復元
      restore:
        bandwidth: 10            # 復元時の帯域
      count: 3                   # 3回繰り返し
  - at: 80
    type: link_down              # 周期的リンク断（repeat付き）
    nodes: [2, 4]
    repeat:
      interval: 45
      duration: 15
      restore_type: link_up      # 復旧イベントの type
      count: 3

  # --- コンテンツ操作イベント (put / get) -----------------------------------
  # put イベント: フラッピング中などネットワーク不安定な状況で任意タイミングにコンテンツを配信
  # ・FIBは put/pubsub_pub イベントのhost/uriから自動設定される
  - at: 35
    type: put
    host: 4                      # パブリッシャーホストID
    uri: "ccnx:/test/event_data"
    file: "./sample-putfile"
    # rate: 10                   # 転送レート (Mbps) [オプション]
    # expiry: 3000               # Content Objectライフタイム (秒) [オプション]
    # cache_time: 3000           # キャッシュ削除期間 (秒) [オプション]

  # get イベント: put より後の時刻を指定。結果は results.json に記録される（phase: "event"）
  - at: 45
    type: get
    host: 0
    uri: "ccnx:/test/event_data"
    # pipeline: 4                # パイプライン数 [オプション]

  # --- コンテンツ操作イベント (pubsub_sub / pubsub_pub) --------------------
  # 同じ at 時刻でも pubsub_sub が先に起動される（優先度制御）。
  # pubsub_sub 起動後 pubsub_sub_startup_grace 秒待機してから pubsub_pub が送信される。
  - at: 55
    type: pubsub_sub
    host: 0
    uri: "ccnx:/test/event_stream"
    sub_opts:
      wait: 20                   # cefsubfile 待機時間 (秒)

  - at: 55
    type: pubsub_pub
    host: 4
    uri: "ccnx:/test/event_stream"
    file: "./sample-putfile"
    pub_opts:
      lifetime: 8                # Trigger Interest ライフタイム (秒)

#   - at: 90
#     type: compute_call           # 外部API呼び出し（bridges設定で到達性確保が必要）
#     host: 3
#     endpoint: "http://10.0.0.100:8080/api/process"
#     method: POST                 # GET or POST
#     payload: '{"query": "analyze"}'
#     output_file: "compute_result.json"   # run_dir 配下に保存
#     timeout: 30
#     # publish_uri: "ccnx:/compute/result1"  # 結果をCeforeで配信

# -----------------------------------------------------------------------------
# モニタリング (定期収集)
# -----------------------------------------------------------------------------
monitoring:
  interval: 5                    # 収集間隔 (秒)
  output_json: "monitor.json"    # JSON出力ファイル名
  output_csv: "monitor.csv"      # CSV出力ファイル名
  targets:
    - type: cefstatus            # cefstatus出力収集
      hosts: "all"               # "all", "cache", またはリスト [0, 1, 2]
    - type: csmgrstatus          # csmgrstatus出力収集
      hosts: "cache"             # キャッシュノードのみ
      uri: "ccnx:/"             # クエリURI [オプション]

# -----------------------------------------------------------------------------
# 実行制御
# -----------------------------------------------------------------------------
no_cli: true           # true: インタラクティブCLIをスキップ (自動テスト用)
duration: 0            # 評価フェーズ時間 (秒, 0: シングルサイクル, no_cli時に使用)
results_json: ""       # 結果JSONファイル名 (空文字で無効, 出力ディレクトリ内に配置)

# pubsub_sub_startup_grace: サブスクライバー起動後にパブリッシャーを送信するまでの待機時間 (秒)
# cefsubfile 起動直後は cefnetd 内の Reflexive Interest 受付準備が整っていないため、
# grace 秒待機することで startup race を回避する。
pubsub_sub_startup_grace: 1.0

publisher_host: 4                  # パブリッシャーホスト (publisher-downメトリクス用)

# -----------------------------------------------------------------------------
# 帯域制御 (静的: 起動時に適用)
# -----------------------------------------------------------------------------
# 注意: スイッチ名(s0等)はトポロジ生成結果に依存する。topo_png の出力画像や
# 起動ログで実際のスイッチ名を確認してから指定すること。
# 動的な帯域変更は events の bw_set イベントで行う。
# bw:                                # リンク帯域設定 (リスト形式)
#   - "h0,s0,10"                     # ノードA,ノードB,帯域(Mbps)
#   - "h1,s1,5"

# -----------------------------------------------------------------------------
# 外部インターフェース
# -----------------------------------------------------------------------------
#ext: []                            # 外部インターフェース接続 (リスト形式)
# ext:
#   - "h0,eth1,192.168.100.1/24,1500"   # host,ifname,ip,mtu

# -----------------------------------------------------------------------------
# ルートネームスペースブリッジ
# -----------------------------------------------------------------------------
#bridges: []                        # ブリッジ設定 (リスト形式)
# bridges:
#   - switch: "s0"                       # ブリッジ対象スイッチ
#     root_ip: "192.168.200.1/24"        # ルートNS側IPアドレス
#     local_routes: "192.168.0.0/16"     # ローカルルート (文字列, route add -net に渡す)
#     nat: true                          # NAT有効化
#     nat_out: "eth0"                    # NAT外部インターフェース

# -----------------------------------------------------------------------------
# アドレッシング設定
# -----------------------------------------------------------------------------
# Cefore リンクアドレスのベースネットワーク。IPv4 /16 のみ指定可。
# モデル: 1リンク = /24、第3オクテット = リンクID、第4オクテット = ホストIDX+1
# デフォルト: 192.168.0.0/16 (省略時)
# 対応シナリオ: disaster / ceforeemu-connect
#   → mesh / linear はこの設定を読まず、デフォルト (192.168.0.0/16) を使用する
# 注意: network_cidr を変更した場合、events の fib_add/fib_del/fib_enable 等の
#       next_hop フィールドも同じアドレス体系に合わせて手動で書き換えること。
# addressing:
#   network_cidr: "192.168.0.0/16"
