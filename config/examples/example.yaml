# -----------------------------------------------------------------------------
# ウォームアップ設定
# -----------------------------------------------------------------------------
# warmup_get_interval: 3       # ウォームアップ取得間隔 (秒)
# warmup_only_cache_nodes: true  # true: キャッシュノードのみでウォームアップ
# hot_uris:                     # プリキャッシュ対象URI
#   - "ccnx:/test/sample"
# warmup_gets:                  # 明示的なウォームアップ操作リスト（hot_uris より優先）
#   - host: 1
#     uri: "ccnx:/test/sample"

# -----------------------------------------------------------------------------
# 実行制御
# -----------------------------------------------------------------------------
no_cli: false          # true: インタラクティブCLIをスキップ (自動テスト用)
duration: 0            # 評価フェーズ時間 (秒, 0: シングルサイクル, no_cli時に使用)
results_json: ""       # 結果JSONファイル名 (空文字で無効, 出力ディレクトリ内に配置)
get_interval: 10       # cefgetfile実行間隔 (秒)

publisher_host: 4                  # パブリッシャーホスト (publisher-downメトリクス用)

# -----------------------------------------------------------------------------
# 帯域制御 (静的: 起動時に適用)
# -----------------------------------------------------------------------------
# 注意: スイッチ名(s0等)はトポロジ生成結果に依存する。topo_png の出力画像や
# 起動ログで実際のスイッチ名を確認してから指定すること。
# 動的な帯域変更は events の bw_set イベントで行う。
# bw:                                # リンク帯域設定 (リスト形式)
#   - "h0,s0,10"                     # ノードA,ノードB,帯域(Mbps)
#   - "h1,s1,5"

# -----------------------------------------------------------------------------
# 外部インターフェース
# -----------------------------------------------------------------------------
