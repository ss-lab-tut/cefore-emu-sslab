hosts: 12
switches: 25
seed: 77
k: 2

# Per-node cache configuration (Phase 3 feature)
cache_config:
  strategy: k_centers      # k_centers | manual | degree_based
  default:
    count: 5               # Number of cache nodes to select
    capacity: 819200       # CACHE_CAPACITY (bytes)
    default_rct_ms: 1800000  # CACHE_DEFAULT_RCT (ms)
    algorithm: "LRU"       # CACHE_ALGORITHM: LRU | LFU | FIFO | None
    type: "memory"         # CACHE_TYPE: memory | filesystem

  # Per-node overrides (applied after default)
  nodes:
    - id: [5, 6]           # High-capacity cache nodes
      capacity: 1638400
      algorithm: "LFU"
      default_rct_ms: 3600000
    - id: [7, 8]           # Standard cache nodes (use defaults)
      capacity: 819200
    - id: [9]              # Edge cache — small capacity, short retention
      capacity: 204800
      default_rct_ms: 900000

failure_scenarios:
  strategy: cyclic
  cycles:
    - interval: 30
      duration: 10
      count: 2
    - interval: 30
      duration: 15
      count: 3

auto:
  - uri: "ccnx:/test/content"
    publishers: [11]
    consumers: "random:5"
    content_count: 3
