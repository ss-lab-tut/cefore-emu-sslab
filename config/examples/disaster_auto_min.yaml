## Minimal starter config for disaster event content operations
## Usage:
##   sudo python3 -m src disaster --config config/examples/disaster_auto_min.yaml

# Topology
hosts: 5
switches: 9
seed: 42
k: 4

# Content operations are configured only through events.
events:
  - {at: 5, type: put, host: 4, uri: "ccnx:/test/experiment/content1", file: "./sample-putfile"}
  - {at: 10, type: get, host: 0, uri: "ccnx:/test/experiment/content1"}
  - {at: 15, type: get, host: 1, uri: "ccnx:/test/experiment/content1"}

# Output (optional but recommended)
num: 1
output_dir: "logs"
timestamp: false
topo_png: "topology.png"
topo_layout: "spring"

# Optional: run in non-interactive mode + emit results
# no_cli: true
# duration: 120
# results_json: "results.json"

# Optional: monitoring (periodic status collection)
# monitoring:
#   interval: 5
#   output_json: "monitor.json"
#   output_csv: "monitor.csv"
