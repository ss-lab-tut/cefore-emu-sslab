# 最小検証用: pub/sub のみ (cefpubfile / cefsubfile)
# Usage: sudo .venv/bin/python3 -m src disaster --config config/examples/min_pubsub.yaml
#
# pubsub_sub の file は出力ディレクトリとして扱われる。
# cefsubfile は <dir>/RNP0x<hex>.out を動的命名で生成する。
hosts: 3
switches: 3
seed: 42
k: 1
num: 9902
output_dir: "logs/verify"
no_cli: true
duration: 25
results_json: "results.json"
publisher_host: 2
pubsub_sub_startup_grace: 2.0

events:
  - at: 5
    type: pubsub_sub
    host: 0
    uri: "ccnx:/test/stream"
    sub_opts:
      wait: 15   # cefsubfile の待機時間 (秒)
  - at: 5
    type: pubsub_pub
    host: 2
    uri: "ccnx:/test/stream"
    file: "./sample-putfile"
    pub_opts:
      lifetime: 8   # Trigger Interest ライフタイム (秒)
